name: capture-receipts

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - realpoudel/hya-410-earthquake-panel-usgs-and-emsc-nepal-only

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realpoudel/hya-410-earthquake-panel-usgs-and-emsc-nepal-only
      - name: capture quake receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p receipts/hya-410
          if [ -f receipts/hya-410/quake-capture-log.txt ]; then echo "already captured"; exit 0; fi
          START=$(date -u -d "-30 days" +%Y-%m-%d)
          USGS_URL="https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=${START}&minlatitude=26.0&maxlatitude=30.5&minlongitude=80.0&maxlongitude=88.5&minmagnitude=2.5&orderby=time"
          EMSC_URL="https://www.seismicportal.eu/fdsnws/event/1/query?format=json&starttime=${START}&minlatitude=26.0&maxlatitude=30.5&minlongitude=80.0&maxlongitude=88.5&orderby=time"
          BIPAD_URL="https://bipadportal.gov.np/api/v1/earthquake/"
          : > receipts/hya-410/quake-capture-log.txt
          for pair in "usgs-nepal-30d.json:${USGS_URL}" "emsc-nepal-30d.json:${EMSC_URL}" "bipad-earthquake.json:${BIPAD_URL}"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            code=$(curl -sS -o "receipts/hya-410/${name}" -w "%{http_code}" --max-time 60 "$url" || echo CURL_FAIL)
            echo "${url} -> HTTP ${code}" >> receipts/hya-410/quake-capture-log.txt
          done
          echo "--- usgs head ---" >> receipts/hya-410/quake-capture-log.txt
          head -c 500 receipts/hya-410/usgs-nepal-30d.json >> receipts/hya-410/quake-capture-log.txt || true
          echo >> receipts/hya-410/quake-capture-log.txt
          echo "--- emsc head ---" >> receipts/hya-410/quake-capture-log.txt
          head -c 500 receipts/hya-410/emsc-nepal-30d.json >> receipts/hya-410/quake-capture-log.txt || true
          echo >> receipts/hya-410/quake-capture-log.txt
          echo "--- bipad head ---" >> receipts/hya-410/quake-capture-log.txt
          head -c 500 receipts/hya-410/bipad-earthquake.json >> receipts/hya-410/quake-capture-log.txt || true
          echo >> receipts/hya-410/quake-capture-log.txt
          git config user.name "Namuna One"
          git config user.email "realpoudel@duck.com"
          git add receipts/hya-410
          git commit -m "receipts: HYA-410 live capture [skip ci]" || echo "nothing to commit"
          git push origin HEAD:realpoudel/hya-410-earthquake-panel-usgs-and-emsc-nepal-only || true
      - name: file diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R namunaONE/nWeather \
            -t "HYA-410 capture diagnostics" \
            -b "Receipt capture failed; see run ${{ github.server_url }}/namunaONE/nWeather/actions/runs/${{ github.run_id }}" || true
