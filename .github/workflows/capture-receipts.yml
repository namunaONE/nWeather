name: capture-receipts

on:
  pull_request:
  push:
    branches:
      - realpoudel/hya-411-air-dust-and-uv-cams-global-only

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realpoudel/hya-411-air-dust-and-uv-cams-global-only
      - name: capture air + thunder receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p receipts/hya-411
          if [ -f receipts/hya-411/air-capture-log.txt ]; then echo "already captured"; exit 0; fi
          : > receipts/hya-411/air-capture-log.txt
          AQ="https://air-quality-api.open-meteo.com/v1/air-quality?latitude=27.7172&longitude=85.3240"
          FC="https://api.open-meteo.com/v1/forecast?latitude=27.7172&longitude=85.3240&forecast_days=3"
          cap() {
            name="$1"; url="$2"
            code=$(curl -sS -o "receipts/hya-411/${name}" -w "%{http_code}" --max-time 60 "$url" || echo CURL_FAIL)
            echo "${url} -> HTTP ${code}" >> receipts/hya-411/air-capture-log.txt
          }
          cap aq-cams-global-kathmandu.json "${AQ}&domains=cams_global&hourly=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,aerosol_optical_depth,dust,uv_index,us_aqi&past_days=1&forecast_days=5"
          cap aq-cams-global-3hourly.json "${AQ}&domains=cams_global&temporal_resolution=hourly_3hourly&hourly=pm10,pm2_5,dust,uv_index,us_aqi&forecast_days=5"
          cap aq-cams-europe-probe.json "${AQ}&domains=cams_europe&hourly=pm10,pm2_5,us_aqi&forecast_days=2"
          cap fc-thunder-ecmwf_ifs025.json "${FC}&hourly=weathercode,cape&models=ecmwf_ifs025"
          cap fc-thunder-ecmwf_aifs025_single.json "${FC}&hourly=weathercode,cape&models=ecmwf_aifs025_single"
          cap fc-thunder-icon_seamless.json "${FC}&hourly=weathercode,cape&models=icon_seamless"
          cap fc-thunder-ncep_gfs_seamless.json "${FC}&hourly=weathercode,cape&models=ncep_gfs_seamless"
          for f in receipts/hya-411/*.json; do
            echo "--- $(basename "$f") head ---" >> receipts/hya-411/air-capture-log.txt
            head -c 400 "$f" >> receipts/hya-411/air-capture-log.txt || true
            echo >> receipts/hya-411/air-capture-log.txt
          done
          git config user.name "Namuna One"
          git config user.email "realpoudel@duck.com"
          git add receipts/hya-411
          git commit -m "receipts: HYA-411 live capture [skip ci]" || echo "nothing to commit"
          git push origin HEAD:realpoudel/hya-411-air-dust-and-uv-cams-global-only || true
      - name: file diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R namunaONE/nWeather \
            -t "HYA-411 capture diagnostics" \
            -b "Receipt capture failed; see run ${{ github.server_url }}/namunaONE/nWeather/actions/runs/${{ github.run_id }}" || true
