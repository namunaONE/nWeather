# nWeather CI. Gate philosophy from day one (nMiti-style):
# analyze -> test -> build, warnings are errors. Web-first (v1 decision):
# the build artifact is the web bundle, deployed to GitHub Pages from main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: analyze / test / build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: set -o pipefail; flutter pub get

      - name: flutter analyze (fatal-infos)
        run: set -o pipefail; flutter analyze --fatal-infos

      - name: flutter test
        run: set -o pipefail; flutter test

      # Project page: namunaone.github.io/nWeather/ — the base href must
      # match the repo path or every asset 404s under the subpath.
      - name: flutter build web
        run: set -o pipefail; flutter build web --release --base-href "/nWeather/"

      # Uploaded only from main; PRs stop at the build gate.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web

  deploy-pages:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  docs:
    name: docs links exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs referenced from README exist
        run: |
          test -f docs/sources.md
          test -f docs/methodology.md
          test -f docs/developers.md
          test -f LICENSE
          test -f NOTICE
