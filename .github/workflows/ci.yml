# nWeather CI. Gate philosophy from day one (nMiti-style):
# analyze -> test -> build, warnings are errors. Web-first (v1 decision):
# the build artifact is the web bundle, deployed to GitHub Pages from main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# issues: write is for the temporary failure-diagnostics step (remove with it).
permissions:
  contents: write
  issues: write

jobs:
  flutter:
    name: analyze / test / build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: set -o pipefail; flutter pub get 2>&1 | tee /tmp/step-pubget.log

      - name: flutter analyze (fatal-infos)
        run: set -o pipefail; flutter analyze --fatal-infos 2>&1 | tee /tmp/step-analyze.log

      - name: flutter test
        run: set -o pipefail; flutter test 2>&1 | tee /tmp/step-test.log

      # Temporary diagnostics channel: on failure, file an issue with the
      # failing steps' log tails. Remove once HYA-454 is green.
      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated diagnostics for run ${{ github.run_id }} (attempt ${{ github.run_attempt }}), commit ${{ github.sha }}."
            echo
            for f in /tmp/step-*.log; do
              [ -f "$f" ] || continue
              echo "### tail of $f"
              echo '```'
              tail -c 4000 "$f"
              echo
              echo '```'
            done
          } > /tmp/diag.md
          gh issue create --title "CI diagnostics — run ${{ github.run_id }}" --body-file /tmp/diag.md || true

      # Project page: namunaone.github.io/nWeather/ — the base href must
      # match the repo path or every asset 404s under the subpath.
      - name: flutter build web
        run: set -o pipefail; flutter build web --release --base-href "/nWeather/"

      # Official snapshots (HYA-454) ship inside the web bundle, same-origin,
      # so the app reads cache/dhm-official.json with no cross-origin trust.
      - name: stage cache/ into web bundle
        run: |
          if [ -d cache ]; then
            mkdir -p build/web/cache
            cp -r cache/. build/web/cache/
          fi

      # Uploaded only from main; PRs stop at the build gate.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web

  deploy-pages:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  docs:
    name: docs links exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs referenced from README exist
        run: |
          test -f docs/sources.md
          test -f docs/methodology.md
          test -f docs/developers.md
          test -f LICENSE
          test -f NOTICE
