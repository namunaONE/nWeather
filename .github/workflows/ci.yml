# nWeather CI. Gate philosophy from day one (nMiti-style):
# analyze -> test -> build, warnings are errors. Web-first (v1 decision):
# the build artifact is the web bundle; APK lands with the android/ scaffold.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: analyze / test / build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (fatal-infos)
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test

      - name: flutter build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

  docs:
    name: docs links exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs referenced from README exist
        run: |
          test -f docs/sources.md
          test -f docs/methodology.md
          test -f docs/developers.md
          test -f LICENSE
          test -f NOTICE
