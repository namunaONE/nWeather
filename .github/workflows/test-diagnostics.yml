# TEMP diagnostics (HYA-410): capture the failing flutter test output into the
# branch so it can be read without API log access. Remove before merge.
name: test-diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realpoudel/hya-410-earthquake-panel-usgs-and-emsc-nepal-only

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test (capture failure)
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.log 2>&1
          s=$?
          if [ $s -ne 0 ]; then
            mkdir -p receipts/hya-410
            tail -150 /tmp/test.log > receipts/hya-410/test-failure.log
            git config user.name "mistralai"
            git config user.email "noreply@github.com"
            git add receipts/hya-410/test-failure.log
            git commit -m "diagnostics: flutter test failure log [skip ci]"
            git push origin HEAD:realpoudel/hya-410-earthquake-panel-usgs-and-emsc-nepal-only
          fi
          exit $s
